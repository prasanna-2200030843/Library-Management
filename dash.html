<!DOCTYPE html>
<html>
<head>
    <title>Library Dashboard</title>
    <link rel="stylesheet" href="all.css">
</head>
<body>
    <div class="dash">
        <nav class="navbar">
            <h2> Library Management</h2>
            <img src="./logo.png">
            <div class="links">
                <a href="dash.html" class="active">Dashboard</a>
                <a href="add.html">Add Books</a>
                <a href="book.html">Books</a>
                <a href="issue.html">Issue Book</a>
                <a href="issued.html">Issued Books</a>
                <a href="saved.html">Saved Books</a>
                <a href="search.html">Search Books</a>
                <a href="return.html">Return Book</a>
                <a href="login.html">Logout</a>
            </div>
        </nav>
        <div class="main">
            <h1>Dashboard</h1>
            <div class="welcome">
                <h2>Welcome!👋</h2>
                <p>Manage your library books easily</p>
                <!-- <input type="text" placeholder="Search books..."> -->
            </div>
            <div class="cards">
                <div class="card">
                    <h3>Total Books</h3>
                    <p id="totalbooks">0</p>
                </div>
                <!-- <div class="card">
                    <h3>Available Books</h3>
                    <p id="availablebooks">0</p>
                </div> -->
                <div class="card">
                    <h3>Issued Books</h3>
                    <p id="issuedbooks">0</p>
                </div>
            </div>
            <div class="recent">
                <h2>Recently Added Books</h2>
                <div class="table">
                    <div class="head">
                        <span>Book Name</span>
                        <span>Author</span>
                        <span>Status</span>
                    </div>
                    <div id="recentBooks">
                        <p class="empty">No books added yet.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script>
    let recentBooks = JSON.parse(localStorage.getItem("customBooks")) || [];
let recentContainer = document.getElementById("recentBooks");
if (recentBooks.length > 0) {
    recentContainer.innerHTML = "";
    recentBooks.forEach(function(book) {
        recentContainer.innerHTML += `
            <div class="recent-row">
                <span>${book.title}</span>
                <span>${book.author}</span>
                <span class="available-status">${book.status}</span>
            </div>
        `;
    });
} else {
    recentContainer.innerHTML = `<p class="empty">No books added yet.</p>`;
}
</script>
    <script src="all.js"></script>
</body>
</html>
